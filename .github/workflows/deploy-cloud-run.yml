name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once; let an in-progress deploy finish.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

# Configure these under Settings -> Secrets and variables -> Actions -> Variables.
# See README.md ("Deploy to Cloud Run") for the one-time GCP setup.
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'hello-world' }}
  REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'hello-world' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ steps.image.outputs.image }}
          env_vars: |-
            ASPNETCORE_ENVIRONMENT=Production
          # Google OAuth credentials come from Secret Manager, never from the repo.
          secrets: |-
            Authentication__Google__ClientId=google-oauth-client-id:latest
            Authentication__Google__ClientSecret=google-oauth-client-secret:latest
          flags: >-
            --port=8080
            --service-account=${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated

      - name: Show service URL
        run: |
          echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Make sure ${{ steps.deploy.outputs.url }}/signin-google is an authorized redirect URI on the Google OAuth client." >> "$GITHUB_STEP_SUMMARY"
